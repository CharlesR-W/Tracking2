name: Publish report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build measured-only data appendix
        run: |
          PYTHONPATH=src python scripts/verify_lw_post_publication.py --profile committed
          mkdir -p _site/figures
          PYTHONPATH=src python -m tracking2.post_report \
            artifacts/lw_post/dashboard_manifest.json \
            --output _site/index.html
          cmp _site/index.html "LW post/free-body-diagrams-for-neural-networks.html"
          cp "LW post/figures/closing_cycle.svg" _site/figures/
          cp "LW post/figures/cnn_over_training_time.gif" _site/figures/
          cp "LW post/figures/cnn_over_training_time_final.png" _site/figures/
          cp "LW post/figures/cnn_over_training_time_summary.png" _site/figures/
          cp "LW post/figures/cnn_relaxation_time.gif" _site/figures/
          cp "LW post/figures/cnn_relaxation_time_final.png" _site/figures/
          cp "LW post/figures/cnn_resnet_architectures.svg" _site/figures/
          cp "LW post/figures/fbd_materials_nn_analogy.svg" _site/figures/
          cp "LW post/figures/method_make_datasets.svg" _site/figures/
          cp "LW post/figures/method_train_compare.svg" _site/figures/
          cp "LW post/figures/resnet_over_training_time.gif" _site/figures/
          cp "LW post/figures/resnet_over_training_time_final.png" _site/figures/
          cp "LW post/figures/resnet_over_training_time_summary.png" _site/figures/
          cp "LW post/figures/tracking_resolving_only.png" _site/figures/
          cp "LW post/waterfalls.html" _site/waterfalls.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
