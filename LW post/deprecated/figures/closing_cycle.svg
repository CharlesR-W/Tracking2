      <path d="M0,0 L9,4.5 L0,9 Z" fill="#71c6ed"/>
    </marker>
  </defs>
  <circle cx="280" cy="260" r="88" fill="#153849" stroke="#71c6ed" stroke-width="3"/>
  <g fill="none" stroke="#71c6ed" stroke-width="4">
    <rect x="221" y="218" width="30" height="84" rx="7"/>
    <rect x="265" y="198" width="32" height="124" rx="7"/>
    <rect x="311" y="211" width="31" height="98" rx="7"/>
  </g>
  <g fill="none" stroke="#71c6ed" stroke-width="4" marker-end="url(#cycle-arrow)">
    <path d="M280 76 A184 184 0 0 1 459 214"/>
    <path d="M469 257 A184 184 0 0 1 330 440"/>
    <path d="M281 444 A184 184 0 0 1 103 307"/>
    <path d="M91 260 A184 184 0 0 1 228 83"/>
