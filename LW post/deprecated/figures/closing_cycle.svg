    <text x="486" y="250" text-anchor="middle">FIND</text>
    <text x="486" y="274" text-anchor="middle">INVARIANTS</text>
    <text x="280" y="488" text-anchor="middle">PREDICT</text>
    <text x="74" y="250" text-anchor="middle">INTERVENE</text>
  </g>
  <g font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="760" fill="#dff4fb">
    <text x="280" y="255" text-anchor="middle">MIDDLE-OUT</text>
    <text x="280" y="281" text-anchor="middle">ONTOLOGY</text>
  </g>
</svg>
