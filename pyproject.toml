[project]
name = "tracking2"
version = "0.1.0"
description = "CIFAR cumulant-surrogate and layerwise tracking experiments"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<2",
  "plotly>=6.0",
  "pyarrow>=18.0",
  "scikit-learn>=1.5",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
